<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>Upload | Legacy Vault</title>
    <link rel="manifest" href="{{ url_for('manifest_json') }}">
    <link rel="icon" href="{{ url_for('icon_svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('style_css') }}">
</head>

<body>
    <main class="page narrow">
        <p class="eyebrow">Legacy Vault</p>
        <h1>Upload a file</h1>
        {% if error == 'too_large' %}<p class="error" role="alert">That file is larger than 25 MB.</p>{% endif %}
        <form method="post" enctype="multipart/form-data" class="stack"><label for="file">Choose a file</label><input
                id="file" name="file" type="file" required><button class="button primary" type="submit">Upload</button>
        </form>
        <a href="{{ url_for('vault_page') }}">Back to vault</a>
    </main>
</body>

</html>
