services:
  - type: web
    name: legacy-vault
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: legacy-vault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: VAULT_PIN
        sync: false
